# docker-compose.yml
version: "3.8"

services:
  traefik:
    image: "traefik:v3.0"
    container_name: "traefik"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      # - "--certificatesresolvers.myresolver.acme.email=tu_correo@ejemplo.com"
      # - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    restart: unless-stopped

  web:
    build: 
      context: ./r4tlabs-web
      dockerfile: Dockerfile
    container_name: "r4tlabs-web"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MAIN_DOMAIN=${MAIN_DOMAIN}
      - AUTH_DOMAIN=${AUTH_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${MAIN_DOMAIN}`) || Host(`${AUTH_DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      # Descomentar para habilitar HTTPS automáticamente
      # - "traefik.http.routers.web-secure.rule=Host(`${MAIN_DOMAIN}`) || Host(`${AUTH_DOMAIN}`)"
      # - "traefik.http.routers.web-secure.entrypoints=websecure"
      # - "traefik.http.routers.web-secure.tls.certresolver=myresolver"
    restart: unless-stopped
